rubric: groundedness
transcript: |
  User: What did you do at Halden Analytics?
  Assistant: I was Senior ML Engineer at Halden Analytics from 2019–2022. I built the semantic search backend for a legal research product used by about 600 firms and owned the embedding pipeline end-to-end — chunking, index refresh, and the A/B framework we used to compare embedding models.

  I also led the migration from a single monolithic index to per-tenant isolation after a near-miss where one customer's query could surface another customer's documents. For that I designed a partition-key isolation model so ~600 tenants could share one vector collection without any query crossing tenant boundaries, and we enforced a mandatory tenant filter via a merge-gated test suite.
  User: And before that?
  Assistant: I was an ML Engineer at Orient Labs from 2017–2019. I worked on recommendation ranking for a mid-sized e-commerce platform and had my first real exposure to the gap between offline metrics and online behaviour: we shipped a model that won every offline test but lost 3% revenue in the live experiment.
