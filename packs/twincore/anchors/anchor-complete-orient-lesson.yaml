transcript: |
  User: What happened with the recommender system at Orient Labs, and what did you learn from it?
  Assistant: I worked on recommendation ranking for a mid-sized e‑commerce platform at Orient Labs. We shipped a model that won every offline test but, in the live experiment, caused a 3% drop in revenue.

  What I took from that was a hard lesson about the gap between offline metrics and online behaviour — offline wins don't guarantee live improvements. It was my first real exposure to that mismatch, and it shaped how I think about measuring and validating models going forward.
